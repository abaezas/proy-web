{% extends 'tienda/base.html' %}
{% load static %}

{% block title %} Producto {% endblock %}

{% block content %}

<div class="container" style="padding-top: 4rem;">
    <div class="card mb-3 mt-5 text-center">
        <div class="row g-0">
            <div class="col-md-4">
                <img src="{{ producto.imagen.url }}" class="img-fluid rounded-start" alt="...">
            </div>
            <div class="col-md-8">
                <div class="card-body my-5">
                    <center>

                        <h6 class="card-title"> {{ producto.nombre }} </h6>
                        <p class="card-text justified"> {{ producto.descripcion }} </p>
                        <p class="card-text">${{ producto.precio }}</p>
                        <p class="card-text">ID: {{ producto.id }}</p>
                        <a href="{% url 'home' %}">
                            <button class="btn-carta">Volver</button>
                        </a>
                        <button type="button" class="btn-carta" value="{{producto.id}}" id="carro_agregar">Añadir al
                            Carrito</button>
                    </center>
                </div>
            </div>
        </div>
    </div>
</div>

<script>

    $(document).ready(function(e){
        e.preventDefault();
    })

    $(document).on('click', '#carro_agregar', function(e){
        e.preventDefault();
        $.ajax({

            type: 'POST',
            url: "{% url 'carritoAgregar' %}",
            data: {
                producto_id: $('#carro_agregar').attr("value"),
                csrfmiddlewaretoken: '{{ csrf_token }}',
                action: 'post'
            },

            success: function (json) {
                console.log(json)
            },

            error: function (xhr, errmsg, err) {
                
            }

        });
    })

</script>

{% endblock %}
